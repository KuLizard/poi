<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/public/css/register.css">
</head>
<body>
    <div class="titulos">
        <img src="/public/img/e8d2efe6a472abf4deacd3b72b2affd0.png" alt="Icono de usuario">
        <h1>Página que se parece mucho a Discord</h1>
    </div>
    <div class="subtitulo">
        <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </div>
    <div class="registro">

        <!-- Form del registro-->
        
        <form id="form-registro" method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="username" class="form-label">Nombre de usuario:</label>
                <input
                    type="text"
                    class="form-control"
                    id="username"
                    name="username"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico:</label>
                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="image" class="form-label">Foto de perfil:</label>
                <input
                    type="file"
                    class="form-control"
                    id="image"
                    name="image"
                    accept="image/jpeg,image/png,image/webp"
                >
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Contraseña:</label>
                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="confirmar-password" class="form-label">
                    Confirmar contraseña:
                </label>
                <input
                    type="password"
                    class="form-control"
                    id="confirmar-password"
                    name="confirmar-password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-success w-100">
                Registrarse
            </button>
        </form>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/registro.js"></script>
</body>
</html>
