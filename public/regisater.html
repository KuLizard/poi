<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/register.css">
</head>
<body>
    <div id="navbar"></div>

    <div class="registro">
        <form id="form-registro" method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="username" class="form-label">Nombre de usuario:</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico:</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>

            <div class="mb-3">
                <label for="image" class="form-label">Foto de perfil:</label>
                <input type="file" class="form-control" id="image" name="image" accept="image/jpeg,image/png,image/webp">
            </div>

            <div class="mb-3">
                <label for="pass" class="form-label">Contraseña:</label>
                <input type="password" class="form-control" id="pass" name="pass" required>
            </div>

            <div class="mb-3">
                <label for="confirmar-password" class="form-label">Confirmar contraseña:</label>
                <input type="password" class="form-control" id="confirmar-password" name="confirmar-password" required>
            </div>

            <button type="submit" class="btn btn-success w-100">Registrarse</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/registro.js"></script>
    <script src="/js/landing.js"></script>
</body>
</html>
