<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <div class="titulos">
        <img src="/public/img/e8d2efe6a472abf4deacd3b72b2affd0.png" alt="Icono de usuario">
        <h1>Página que se parece mucho a Discord</h1>
    </div>
    <div class="subtitulo">
        <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </div>
    <div class="registro">
        <form action="" novalidate>
            <label for="username">Nombre de usuario:</label>
                <input type="text" id="username" name="username">
            <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email">
            <label for="pic">Foto de perfil:</label>
                <input type="file" id="pic" name="pic" accept="image/*">
            <label for="nacimiento">Fecha de nacimiento:</label>
                <input type="date" id="nacimiento" name="nacimiento">
            <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password">
            <label for="validarcontrasena">Validar contraseña:</label>
                <input type="password" id="validarcontrasena" name="validarcontrasena">
            <button type="submit">Registrarse</button>
        </form>
    </div>
</body>
</html>
