<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía turística</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/guia.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
    
    <div id="chats"></div>

    <div class="container my-4">

        <div class="titulos text-center mb-4">
            <h1>GUÍA TURÍSTICA</h1>
            <h3>De la Ciudad de Monterrey - La Sultana del Norte - La Ciudad de las Montañas</h3>
        </div>

        <div class="mapa card mb-4">
            <div class="card-body text-center">
                <div id="map"></div>
                <!--<img src="/public/img/Monterrey.jpg" class="img-fluid rounded" style="max-width:auto;">-->
            </div>
        </div>

        <div class="ubicaciones card">
            <div class="card-body">

                <h4 class="mb-3 text-success">Buscar un sitio</h4>
                <div id="formularioBusqueda">

                    <form id="formBuscar" novalidate>
                        <label for="nombre">Ingresa aquí el sitio que deseas buscar: </label>
                            <input type="text" id="busquedaFormularioBuscar">
                        <button type="submit">Buscar</button>
                    </form>

                </div>

                <h4 class="mb-3 text-success">Sitios de interés</h4>

                <ul id="ubicaciones" class="list-group list-group-flush">
                    <!-- aquícargamos las lugares -->
                </ul>

            </div>
        </div>
    </div>


    <div class="container my-4">
        <div class="titulos text-center my-4">
            <h3>Agregar lugares de interés nuevos</h3>
        </div>
        <div class="ubicaciones card">
            <div class="card-body">
                <div id="formularioSitios" class="text-center">

                    <form id="formRegistrar" novalidate>
                        <label for="nombre">Ingresa aquí el nombre del sitio: </label>
                            <input type="text" id="nombre" name="nombre">
                        
                        <label for="tipo">Tipo: </label>
                            <select id="tipo" name="tipo">
                                <option value="parque">Parque</option>
                                <option value="turismo">Turismo</option>
                                <option value="museo">Museo</option>
                                <option value="plaza">Plaza</option>
                                <option value="historico">Histórico</option>
                                <option value="religioso">Religioso</option>
                                <option value="naturaleza">Naturaleza</option>
                                <option value="gastronomico">Gastronomía</option>
                                <option value="plazacomercial">Plaza comercial</option>
                            </select>
                        <label for="ubicaicon">Ubicación: </label>
                            <input type="text" id="ubicaicon" name="ubicaicon">
                        <label for="servicio">Servicios que otorga: </label>
                            <input type="text" id="servicio" name="servicio">
                        <button type="submit">Registrar</button>
                    </form>

                </div>
            </div>
        </div>
    </div>



    <div id="navbar"></div>

    <script src="/js/navbar.js"></script>
    <script src="/js/guia.js"></script>
    <script src="/js/medallasgesstor.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/profile.js"></script>

</body>
</html>
