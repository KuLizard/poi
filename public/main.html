<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chats</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>

    <main class="container py-3">

        <!-- Filtros de conversaciones -->
        <div class="barra-superior btn-group w-100 mb-3" role="group" aria-label="Filtrar conversaciones">
            <button id="todos" class="btn btn-success" type="button">Todos</button>
            <button id="grupos" class="btn btn-outline-success" type="button">Grupos</button>
        </div>

        <!-- Usuarios cargados desde MySQL -->
        <section id="todos-div" class="todo list-group">
            <p class="list-group-item text-muted mb-0">Cargando usuarios...</p>
        </section>

        <!-- Chats grupales -->
        <section id="grupos-div" style="display: none;">

            <div class="mb-3">
                <button id="crear-grupo" class="btn btn-success w-100" type="button">
                    <i class="bi bi-plus-circle"></i> Crear grupo
                </button>
            </div>

            <div id="lista-grupos" class="grupos list-group">
                <p class="list-group-item text-muted mb-0">Todavía no hay grupos cargados.</p>
            </div>

        </section>

    </main>

    <!-- Modal para crear grupos -->
    <div class="modal fade" id="modalCrearGrupo" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Crear grupo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                <div class="modal-body">

                    <!-- Nombre del grupo -->
                    <div class="mb-3">
                        <label for="nombre-grupo" class="form-label">Nombre del grupo</label>
                        <input type="text" id="nombre-grupo" class="form-control" maxlength="100" placeholder="Nombre del grupo">
                    </div>

                    <!-- Participantes -->
                    <label class="form-label">Seleccionar participantes</label>

                    <div id="usuarios-grupo" class="list-group">
                        <p class="list-group-item text-muted mb-0">Cargando usuarios...</p>
                    </div>

                    <p class="text-muted small mt-2 mb-0">
                        Selecciona al menos dos usuarios además de ti.
                    </p>

                    <p id="error-grupo" class="text-danger small mt-2 mb-0"></p>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button type="button" id="guardar-grupo" class="btn btn-success">
                        Crear grupo
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Barra de navegación -->
    <div id="navbar"></div>

    <script src="/js/navbar.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/guia.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
