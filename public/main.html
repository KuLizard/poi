<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/public/css/main.css">
    <link rel="stylesheet" href="/src/output.css">
</head>
<body>
    <h1 class="bg-amber-500">
        prueba
    </h1>
    <div class="barra-superior btn-group" role="group">
        <button id="todos" class="btn btn-success">Todos</button>
        <button id="grupos" class="btn btn-outline-success">Grupos</button>
        <button id="sin-leer" class="btn btn-outline-success">Sin leer</button>
    </div>
    <div id="todos-div" class="todo list-group" style="display: block;">
        <p class="list-group-item">Chat 1</p>
        <p class="list-group-item">Chat 2</p>
        <p class="list-group-item">Chat 3</p>
    </div>
    <div id="grupos-div" class="grupos list-group" style="display: none;">
        <p class="list-group-item">Chat grupa 1</p>
        <p class="list-group-item">Chat grupa 2</p>
        <p class="list-group-item">Chat grupa 3</p>
    </div>
    <div id="sin-leer-div" class="sin-leer list-group" style="display: none;">
        <p class="list-group-item">Chat sin leer 1</p>
        <p class="list-group-item">Chat sin leer 2</p>
        <p class="list-group-item">Chat sin leer 3</p>
    </div>
    <div id="navbar"></div>
    <script src="/public/js/navbar.js"></script>
    <script src="/public/js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
