<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/public/css/profile.css">
</head>
<body>
    <div id="chats"></div>
    <div class="usuario">
        <img src="/public/img/IMG_2216.jpg" alt="Icono de usuario" class="rounded-circle">
        <p class="fw-semibold mb-1">(usuario)</p>
        <p class="text-muted mb-1">correo</p>
        <p class="text-muted small">fecha en la que se registró</p>
        <button id="editar-perfil" class="btn btn-success">Editar perfil</button>
    </div>
    <div id="editar-perfil-div" class="editar-perfil-div" style="display: none;">
        <form action="" novalidate>
            <div class="mb-3">
                <label for="username" class="form-label">Nombre de usuario:</label>
                <input type="text" class="form-control" id="username" name="username">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico:</label>
                <input type="email" class="form-control" id="email" name="email">
            </div>
            <div class="mb-3">
                <label for="pic" class="form-label">Foto de perfil:</label>
                <input type="file" class="form-control" id="pic" name="pic" accept="image/*">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña:</label>
                <input type="password" class="form-control" id="password" name="password">
            </div>
            <div class="mb-3">
                <label for="validarcontrasena" class="form-label">Validar contraseña:</label>
                <input type="password" class="form-control" id="validarcontrasena" name="validarcontrasena">
            </div>
            <button type="submit" class="btn btn-success w-100">Guardar cambios</button>
        </form>
    </div>
    <script src="/public/js/profile.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
