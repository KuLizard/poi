<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
</head>
<body>
    <div id="chats"></div>
    <div class="usuario">
        <img src="/public/img/IMG_2216.jpg" alt="Icono de usuario"">
        <p>(usuario)</p>
        <p>correo</p>
        <p>fecha en la que se registró</p>
        <button id="editar-perfil">Editar perfil</button>
    </div>
    <div id="editar-perfil-div" class="editar-perfil-div" style="display: none;">
        <form action="" novalidate>
            <label for="username">Nombre de usuario:</label>
                <input type="text" id="username" name="username">
            <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email">
            <label for="pic">Foto de perfil:</label>
                <input type="file" id="pic" name="pic" accept="image/*">
            <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password">
            <label for="validarcontrasena">Validar contraseña:</label>
                <input type="password" id="validarcontrasena" name="validarcontrasena">
            <button type="submit">Registrarse</button>
        </form>
    </div>
    <script src="/public/js/profile.js"></script>
</body>
</html>
