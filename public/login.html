<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">    
    <link rel="stylesheet" href="/public/css/login.css">
</head>
<body>
    <div class="titulos">
        <img src="/public/img/e8d2efe6a472abf4deacd3b72b2affd0.png" alt="Icono de usuario">
        <h1>Página que se parece mucho a Discord</h1>
    </div>
    <div class="subtitulo">
        <p>¿No tienes cuenta? <a href="regisater.html">Registrarse</a></p>
    </div>
    <div class="login">
        <form action="main.html" method="get">
            <div class="mb-3">
                <label for="usuarioemail" class="form-label">Nombre de usuario o correo electrónico:</label>
                <input type="text" class="form-control" id="usuarioemail" name="usuarioemail">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña:</label>
                <input type="password" class="form-control" id="password" name="password">
            </div>
            <button type="submit" class="btn btn-success w-100">Iniciar sesión</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
