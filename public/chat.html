<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/public/css/chat.css">
</head>
<body>
    <div id="chats"></div>
    <div class="usuario card mb-3">
        <div class="card-body d-flex align-items-center justify-content-between">
            <div class="titulo d-flex align-items-center gap-2">
                <img src="/public/img/GUGR9hoWwAAiXa2.png" alt="Icono de usuario" class="rounded-circle" style="width:40px; height:40px;">
                <img src="/public/img/online_status.png" style="width:12px; height:12px;">
                <p class="fw-semibold mb-0">(usuario)</p>
            </div>
            <div class="funciones">
                <button class="btn btn-outline-success btn-sm">Llamar</button>
                <button class="btn btn-outline-success btn-sm">Videollamar</button>
            </div>
        </div>
    </div>
    <div class="chat card mb-3">
        <div class="card-body">
            <p class="mensaje-recibido">Hola</p> <!--marcar distintos mensajes que envió el usuario, y que envíamos nosotros?-->
            <p class="mensaje-recibido">porque ya no me manda unos whatsap</p>
            <img src="/public/img/220px-Sceptile_wall.png" class="img-fluid rounded" style="width: 200px; height: auto;"> <!--imagen que el usuario llegó a adjuntar-->
        </div>
    </div>
    <div class="mensaje card">
        <div class="card-body d-flex flex-column gap-2">
            <form class="d-flex gap-2">
                <input type="text" class="form-control" placeholder="Escribe un mensaje...">
                <button type="submit" class="btn btn-success">Enviar</button>
            </form>
            <div class="acciones">
                <button class="btn btn-outline-success btn-sm">Adjuntar imagen</button>
            </div>
        </div>
    </div>
    <script src="/public/js/profile.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
