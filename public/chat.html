<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/chat.css">
</head>

<body>

    <!-- Área de conversaciones -->
    <div id="chats"></div>

    <div>
        <a href="main.html"><button class="btn btn-success">←</button></a>
    </div>

    <!-- Encabezado del chat -->
    <header class="usuario card mb-3">
        <div class="card-body d-flex align-items-center justify-content-between">

            <div class="titulo d-flex align-items-center gap-2">
                <img id="foto-usuario" src="/img/GUGR9hoWwAAiXa2.png" alt="Foto del usuario" class="rounded-circle" style="width: 40px; height: 40px; object-fit: cover;">

                <img id="estado-usuario" src="/img/online_status.png" alt="Estado de conexión" style="width: 12px; height: 12px;">

                <p id="nombre-usuario" class="fw-semibold mb-0">Usuario</p>
            </div>            

            <div class="funciones d-flex gap-2">
                <button type="button" id="btn-tareas" class="btn btn-outline-success btn-sm" style="display: none;">
                    <i class="bi bi-list-check"></i> Tareas
                </button>

                <button type="button" id="btn-participantes" class="btn btn-outline-success btn-sm" style="display: none;">
                    <i class="bi bi-people"></i> Participantes
                </button>

                <button type="button" id="btn-videollamar" class="btn btn-outline-success btn-sm">
                    Videollamada
                </button>
            </div>

        </div>
    </header>

    <!-- Modal de participantes -->
    <div class="modal fade" id="modalParticipantes" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Participantes del grupo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                <div class="modal-body">
                    <div id="lista-participantes" class="list-group">
                        <p class="text-muted mb-0">Cargando participantes...</p>
                    </div>
                </div>

            </div>
        </div>
    </div>


    <div class="modal fade" id="modalCrearGrupo" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 id="titulomodal" class="modal-title">Tareas</h5>
                </div>

                <div class="contenidotareas mb-3">
                    <ul id="tareaslista" class="list-group list-group-flush">
                        <!-- aquícargamos las tareas  -->
                    </ul>
                </div>
                <div class="registrar">
                    <form id="formCrearTarea" class="d-flex gap-2">
                        <input type="text" id="titulo" name="titulo" class="form-control" placeholder="Escribe una tarea nueva...">
                        <button type="submit" class="btn btn-success">Publicar</button>
                    </form>
                </div> 
            </div>
        </div>
    </div>


    <!-- Área de mensajes -->
    <main class="chat card mb-3">
        <div id="mensajes" class="card-body" aria-live="polite" aria-label="Mensajes de la conversación">
            <!-- JavaScript insertará aquí los mensajes -->
        </div>
    </main>

    <!-- Formulario para enviar mensajes -->
    <footer class="mensaje card">
        <div class="card-body">

            <form id="form-mensaje" class="d-flex gap-2">
                <input type="text" id="contenido-mensaje" name="content" class="form-control" placeholder="Escribe un mensaje..." autocomplete="off" maxlength="2000" required>

                <button type="submit" id="btn-enviar" class="btn btn-success">Enviar</button>
            </form>

            <div class="acciones mt-2">
                <input type="file" id="archivo-imagen" accept="image/*" hidden>

                <button type="button" id="btn-adjuntar" class="btn btn-outline-success btn-sm">Adjuntar imagen</button>
            </div>

        </div>
    </footer>

    <div class="modal fade" id="modalVideollamada" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content bg-dark text-white">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" id="tituloVideollamada">Videollamada</h5>
                    <button type="button" class="btn-close btn-close-white" id="btnCerrarVideollamada" aria-label="Cerrar"></button>
                </div>

                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-12">
                            <video id="video-remoto" autoplay playsinline class="w-100 rounded bg-secondary"></video>
                        </div>

                        <video id="video-local" autoplay muted playsinline style="display: none;"></video>
                    </div>

                    <div id="controles-llamada" class="d-flex justify-content-center gap-2 mt-4">
                        <button id="btnMicrofono" class="btn btn-outline-light">Micrófono</button>
                        <button id="btnCamara" class="btn btn-outline-light">Cámara</button>
                        <button id="btnColgar" class="btn btn-danger">Colgar</button>
                    </div>

                    <div id="llamada-entrante" class="text-center mt-3" style="display: none;">
                        <p id="textoLlamadaEntrante">Llamada entrante...</p>
                        <button id="btnAceptarLlamada" class="btn btn-success">Aceptar</button>
                        <button id="btnRechazarLlamada" class="btn btn-danger">Rechazar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
    <script src="/js/chat.js"></script>
    <script src="/js/medallasgesstor.js"></script>
</body>
</html>
