<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    >

    <link rel="stylesheet" href="/poi/public/css/chat.css">
</head>

<body>

    <!-- Área de conversaciones -->
    <div id="chats"></div>

    <div class="container my-3">
        <label for="usuario-prueba" class="form-label">
            Usuario de prueba:
        </label>

        <select id="usuario-prueba" class="form-select">
            <option value="">Selecciona un usuario</option>
        </select>
    </div>

    <!-- Encabezado del chat -->
    <header class="usuario card mb-3">
        <div class="card-body d-flex align-items-center justify-content-between">

            <div class="titulo d-flex align-items-center gap-2">
                <img
                    id="foto-usuario"
                    src="/poi/public/img/GUGR9hoWwAAiXa2.png"
                    alt="Foto del usuario"
                    class="rounded-circle"
                    style="width: 40px; height: 40px; object-fit: cover;"
                >

                <img
                    id="estado-usuario"
                    src="/poi/public/img/online_status.png"
                    alt="Estado de conexión"
                    style="width: 12px; height: 12px;"
                >

                <p id="nombre-usuario" class="fw-semibold mb-0">
                    Usuario
                </p>
            </div>

            <div class="funciones">
                <button
                    type="button"
                    id="btn-llamar"
                    class="btn btn-outline-success btn-sm"
                >
                    Llamar
                </button>

                <button
                    type="button"
                    id="btn-videollamar"
                    class="btn btn-outline-success btn-sm"
                >
                    Videollamar
                </button>
            </div>

        </div>
    </header>

    <!-- Área de mensajes -->
    <main class="chat card mb-3">
        <div
            id="mensajes"
            class="card-body"
            aria-live="polite"
            aria-label="Mensajes de la conversación"
        >
            <!-- JavaScript insertará aquí los mensajes -->
        </div>
    </main>

    <!-- Formulario para enviar mensajes -->
    <footer class="mensaje card">
        <div class="card-body">

            <form id="form-mensaje" class="d-flex gap-2">

                <input
                    type="text"
                    id="contenido-mensaje"
                    name="content"
                    class="form-control"
                    placeholder="Escribe un mensaje..."
                    autocomplete="off"
                    maxlength="5000"
                    required
                >

                <button
                    type="submit"
                    id="btn-enviar"
                    class="btn btn-success"
                >
                    Enviar
                </button>

            </form>

            <div class="acciones mt-2">
                <input
                    type="file"
                    id="archivo-imagen"
                    accept="image/*"
                    hidden
                >

                <button
                    type="button"
                    id="btn-adjuntar"
                    class="btn btn-outline-success btn-sm"
                >
                    Adjuntar imagen
                </button>
            </div>

        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="http://localhost:3000/socket.io/socket.io.js"></script>
    <script src="/poi/public/js/chat.js"></script>

</body>
</html>
